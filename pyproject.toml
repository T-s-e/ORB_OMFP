[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-omfp"
version = "0.2.0"
description = "Optimal regularization bands for overparameterized models in financial prediction"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
orb-omfp = "orb_omfp.__main__:main"

[tool.setuptools]
packages = ["orb_omfp"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

